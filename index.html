<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartão de Perfil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="pagina">
      <section class="cartao" aria-labelledby="nome-perfil">
        <header class="cartao__topo">
          <figure class="avatar">
            <img
              src="assets/avatar.jpg"
              alt="Foto de perfil de Gabriel Andrade de Oliveira"
            />
          </figure>

          <h1 id="nome-perfil" class="nome">Gabriel Andrade de Oliveira</h1>
          <p class="cargo">Desenvolvedor Front-End</p>
        </header>

        <section class="sobre" aria-label="Resumo profissional">
          <p>
            Transformo ideias em interfaces rápidas e acessíveis. Foco em HTML
            semântico, CSS moderno e boas práticas de UX, sempre buscando código
            limpo e fácil de manter.
          </p>
        </section>

        <footer class="redes">
          <a
            href="https://github.com/gabrielandradedeoliveiar1920-alt"
            class="link-rede"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Perfil no GitHub"
          >
            GitHub
          </a>

          <a
            href="https://www.linkedin.com/in/gabriel-andrade-de-oliveira-132200332/"
            class="link-rede"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Perfil no LinkedIn"
          >
            LinkedIn
          </a>

          <a
            href="https://www.instagram.com/andradedeoliveirag/"
            class="link-rede"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Perfil no Instagram"
          >
            Instagram
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
